# Renders YouTube videos with ffmpeg (too heavy for Vercel functions) and ticks the YouTube engine cron.
# Repo secrets: APP_URL and CRON_SECRET (same as cron.yml). No YouTube or Supabase credentials are given to this job.
name: youtube-render

on:
  schedule:
    - cron: "11,41 * * * *"   # every 30 minutes: tick, render, tick again (uploads)
  workflow_dispatch:

concurrency:
  group: youtube-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tick (drafts, voice and images for approved videos, uploads)
        env: { APP_URL: "${{ secrets.APP_URL }}", CRON_SECRET: "${{ secrets.CRON_SECRET }}" }
        run: |
          [ -n "$APP_URL" ] && [ -n "$CRON_SECRET" ] || { echo "APP_URL and CRON_SECRET repo secrets are required"; exit 1; }
          curl -sS --max-time 330 -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/cron/youtube" | head -c 600; echo
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Render queued videos
        env: { APP_URL: "${{ secrets.APP_URL }}", CRON_SECRET: "${{ secrets.CRON_SECRET }}" }
        run: node web/scripts/youtube/render.mjs
      - name: Tick again (upload what just rendered)
        env: { APP_URL: "${{ secrets.APP_URL }}", CRON_SECRET: "${{ secrets.CRON_SECRET }}" }
        run: curl -sS --max-time 330 -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/cron/youtube" | head -c 600; echo
